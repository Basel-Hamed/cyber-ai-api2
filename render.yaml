# Render configuration file
services:
  - type: web
    name: cyber-ai-api
    runtime: python
    region: singapore  # Closest to Bangladesh
    plan: free  # or starter, professional etc.
    buildCommand: ./build.sh
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RENDER
        value: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true  # Render will generate a random secret
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1  # Free tier gets 1GB
    healthCheckPath: /api/v1/health
    autoDeploy: true
